nav.tabs button.on{background:var(--g);color:#fff;border-color:var(--g)}
main{max-width:760px;margin:0 auto;padding:4px 10px}

.pad{padding:12px 14px}
.notes textarea{width:100%;min-height:60px;border:1px solid var(--bd);border-radius:10px;padding:8px;font-size:14px}
.alert{background:var(--orb);border-left:4px solid var(--or);padding:10px 12px;border-radius:10px;font-size:14px;margin:10px 0}
.alert.info{background:#eff6ff;border-color:var(--bl)}

.small{font-size:12.5px;color:var(--mu)}

const niceBaht = v => { const r = v<100?5: v<1000?10: v<5000?50:100; return Math.max(r, Math.round(v/r)*r).toLocaleString('en-US'); };
/* converts leftover VND / USD amounts in free text (e.g. typed by friends) to approximate baht */
function toBaht(t){
  if(!t || !/(VND|₫|đ\b|ดอง|US\$|\$\s?\d)/.test(t)) return t;
  const num = x => parseFloat(String(x).replace(/,/g,''));
  const mult = u => u==='k'||u==='K'?1e3 : u==='M'||u==='ล้าน'||u==='tr'?1e6 : 1;
  t = t.replace(/(?:~\s*)?(\d+(?:[.,]\d+)*)\s*(k|K|M|ล้าน|tr)?(?:\s*[–-]\s*(\d+(?:[.,]\d+)*)\s*(k|K|M|ล้าน|tr)?)?\s*(VND|₫|đ\b|ดอง)/g, (m,a,u1,b,u2)=>{
    const U = u2||u1; const lo = num(a)*mult(u1||U)/RATE.VND_PER_THB; const hi = b ? num(b)*mult(U)/RATE.VND_PER_THB : 0;
    return '~฿'+niceBaht(lo)+(b?'–'+niceBaht(hi):''); });
  t = t.replace(/(?:~\s*)?US?\$\s?(\d+(?:[.,]\d+)?)(?:\s*[–-]\s*(\d+(?:[.,]\d+)?))?/g, (m,a,b)=> '~฿'+niceBaht(num(a)*RATE.THB_PER_USD)+(b?'–'+niceBaht(num(b)*RATE.THB_PER_USD):''));
  return t;
}
function fixPrices(t){ if(typeof t!=='string') return t; for(const [o,n] of PRICE_FIX) if(t.includes(o)) t=t.split(o).join(n); return toBaht(t); }
function needsMigration(st){ return (st.v||1) < 4 || !st.budget || st.days.some(d=>d.items.some(x=>x.loc===undefined||x.img===undefined)); }
function migrate(st){
  const idx = seedIndex();
  st.days.forEach(d=>d.items.forEach(x=>{
    const sx = idx[d.id+'|'+x.title];
    if(x.loc===undefined) x.loc = sx ? sx.loc : (x.locked ? '' : locFromMap(x.map));
    if(x.img===undefined){ x.img = sx ? sx.img : ''; x.imgCredit = sx ? sx.imgCredit : ''; x.imgPage = sx ? sx.imgPage : ''; }
  }));
  if((st.v||1) < 3){
    st.days.forEach(d=>{ d.notes = fixPrices(d.notes); d.items.forEach(x=>{ x.cost=fixPrices(x.cost); x.desc=fixPrices(x.desc); }); });
    for(const c of Object.keys(st.hotels||{})) st.hotels[c].forEach(h=>{ h.price=fixPrices(h.price); h.why=fixPrices(h.why); });
  }
  if((st.v||1) < 4 || !st.budget){
    st.days.forEach(d=>d.items.forEach(x=>{
      if(x.cat!==undefined) return;              // already has budget data
      const sx = idx[d.id+'|'+x.title];
      if(sx){ x.costTHB = sx.costTHB; x.cat = sx.cat; if(sx.plan) x.plan = sx.plan; if(sx.paid) x.paid = true; }
      else { const c = parseCostTHB(x.cost); if(c!==null) x.costTHB = c; x.cat = guessCat(x); }
      if(x.excluded===undefined) x.excluded = false;
    }));
    for(const c of Object.keys(st.hotels||{})) st.hotels[c].forEach(h=>{ if(h.priceTHB===undefined) h.priceTHB = HOTEL_PRICE[h.id] || parseCostTHB(h.price, true) || 0; });
    if(!st.budget) st.budget = JSON.parse(JSON.stringify(SEED_BUDGET));
  }
  st.v = 4;
}

let state = null, baseRev = 0, pending = [], flushing = false, online = false, lastSync = 0;

async function fetchRemote(){
  const r = await fetch(STORE + encodeURIComponent(KEY) + '?_=' + Date.now(), {cache:'no-store'});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const txt = (await r.text()).trim();
  if(!txt) return null;
  const j = JSON.parse(txt);
  if(!j || !Array.isArray(j.days)) throw new Error('bad data');
  return j;
}
async function pushRemote(s){
  const body = new URLSearchParams({key:KEY, value:JSON.stringify(s)});
  const r = await fetch(STORE + 'update', {method:'POST', body});
  if(!r.ok) throw new Error('HTTP '+r.status);
  const j = await r.json().catch(()=>({}));
  if(j.status !== 1) throw new Error('store error');
}
async function load(){
  setSync('busy','⏳ กำลังซิงก์…');
  try{
    let remote = await fetchRemote();
    if(!remote){
      const local = JSON.parse(localStorage.getItem(LS)||'null');
      remote = local || seed();
      await pushRemote(remote);
    }
    state = remote; baseRev = state.rev; online = true; lastSync = Date.now(); cache();
    setSync('ok','🟢 ซิงก์แล้ว '+hhmm(lastSync));
    if(needsMigration(state)) mutate(s=>{ if(needsMigration(s)) migrate(s); }, '', 'อัปเดตระบบ (เส้นทาง/รูป/ราคาบาท)');
  }catch(e){
    console.warn(e); online = false;
    state = JSON.parse(localStorage.getItem(LS)||'null') || seed();
    if(needsMigration(state)) migrate(state);
    baseRev = state.rev;
    setSync('off','🔴 ออฟไลน์ – บันทึกในเครื่อง');
    toast('เชื่อมต่อที่เก็บข้อมูลกลางไม่ได้ ใช้ข้อมูลในเครื่องไปก่อน');
  }
  render();
}
/* every change is an operation; on save we re-apply pending ops on top of the latest remote copy so friends' edits are not lost */
function mutate(op, msg, by){
  const res = op(state); if(res) state = res; if(by) state._by = by;
  state.rev = (state.rev||0) + 1; state.updatedAt = Date.now(); state.updatedBy = by || me || 'ไม่ระบุชื่อ';
  cache(); render();
  pending.push(by ? (st=>{ const r=op(st); (r||st)._by=by; return r; }) : op); if(msg) toast(msg);
  flush();
}
async function flush(){
  if(flushing || !pending.length) return;
  flushing = true; setSync('busy','⏳ กำลังบันทึก…');
  const ops = pending.slice();
  try{
    let remote = null;
    try{ remote = await fetchRemote(); }catch(e){ throw e; }
    let next;
    if(remote && remote.rev > baseRev){
      next = remote; for(const op of ops){ const r = op(next); if(r) next = r; }
      next.rev = Math.max(remote.rev, state.rev) + 1;
    } else { next = state; }
    next.updatedAt = Date.now(); next.updatedBy = next._by || me || 'ไม่ระบุชื่อ'; delete next._by;
    await pushRemote(next);
    pending = pending.slice(ops.length);
    state = next; baseRev = next.rev; online = true; lastSync = Date.now(); cache();
    setSync('ok','🟢 บันทึกแล้ว '+hhmm(lastSync)); render();
  }catch(e){
    console.warn(e); online = false;
    setSync('off','🔴 ออฟไลน์ – บันทึกในเครื่อง (จะลองใหม่)');
  }finally{
    flushing = false;
    if(pending.length) setTimeout(flush, online ? 300 : 15000);
  }
}
async function poll(manual){
  if(flushing || pending.length || $('#modal').classList.contains('on') || ['TEXTAREA','INPUT','SELECT'].includes(document.activeElement?.tagName)){ if(manual) toast('กำลังบันทึก/แก้ไขอยู่ ลองใหม่อีกครั้ง'); return; }
  try{
    if(manual) setSync('busy','⏳ กำลังซิงก์…');
    const remote = await fetchRemote();
    online = true; lastSync = Date.now();
    if(remote && remote.rev !== state.rev){
      state = remote; baseRev = remote.rev; if(needsMigration(state)) migrate(state); cache(); render();
      toast('อัปเดตล่าสุดจาก '+(remote.updatedBy||'เพื่อน'));
    } else if(manual) toast('ข้อมูลเป็นปัจจุบันแล้ว');
    setSync('ok','🟢 ซิงก์แล้ว '+hhmm(lastSync));
  }catch(e){ online=false; setSync('off','🔴 ออฟไลน์ – บันทึกในเครื่อง'); }
}

   <div class="row" style="gap:8px"><label style="flex:1">💰 งบต่อคน (บาท)<input id="f_thb" type="number" inputmode="numeric" min="0" step="10" value="${item && typeof item.costTHB==='number' ? item.costTHB : ''}" placeholder="${item?costPP(item):'เว้นว่าง = คำนวณจากข้อความ'}"></label>
   <label style="flex:1">หมวดงบ<select id="f_cat">${CATS.map(c=>`<option value="${c.k}" ${(item?(item.cat||guessCat(item)):'activities')===c.k?'selected':''}>${c.e} ${c.n}</option>`).join('')}</select></label></div>
   <label class="chk"><input type="checkbox" id="f_excl" ${item&&item.excluded?'checked':''}> ✂️ ตัดออกจากงบ</label>
   <label>ลิงก์ Google Maps (เว้นว่าง = สร้างจากชื่อให้อัตโนมัติ)<input id="f_map" value="${esc(x.map)}"></label>
   <label>ลิงก์อื่น ๆ<input id="f_link" value="${esc(x.link)}"></label>
   <label>📍 ตำแหน่งสำหรับเส้นทาง Google Maps (ชื่อสถานที่ + เมือง หรือ lat,lng)<input id="f_loc" value="${esc(curLoc)}" placeholder="เช่น Cat Cat Village, Sa Pa หรือ 22.3297,103.8336"></label>
   <label class="chk"><input type="checkbox" id="f_noroute" ${item && !curLoc ? 'checked':''}> ไม่ต้องใส่รายการนี้ในเส้นทาง</label>
   <label>🖼️ รูปภาพ (ลิงก์รูป) — ไม่บังคับ<input id="f_img" value="${esc(x.img||'')}" placeholder="https://…jpg (แนะนำรูปจาก Wikimedia Commons)"></label>
   <div class="row" style="margin-top:14px"><button class="btn" id="f_save">บันทึก</button><button class="btn sec" id="f_cancel">ยกเลิก</button></div>`);
  $('#f_cancel').onclick = closeModal;
  $('#f_save').onclick = () => {
    const v = id => $('#'+id).value.trim();
    const title = v('f_title'); if(!title){ toast('ใส่ชื่อกิจกรรมก่อน'); return; }
    const noRoute = $('#f_noroute').checked;
    const loc = noRoute ? '' : (v('f_loc') || v('f_local') || title);
    const img = v('f_img'); if(img && !safeUrl(img)){ toast('ลิงก์รูปต้องขึ้นต้นด้วย https://'); return; }
    const sameImg = item && img === (item.img||'');
    const data = {time:v('f_time'),title,local:v('f_local'),desc:v('f_desc'),cost:v('f_cost'),map:v('f_map')||M(loc||v('f_local')||title),link:v('f_link'),loc,img,
      imgCredit: sameImg ? (item.imgCredit||'') : '', imgPage: sameImg ? (item.imgPage||'') : (img ? img : ''),
      cat: $('#f_cat').value, excluded: $('#f_excl').checked};
    const thbRaw = v('f_thb'), oldThb = item && typeof item.costTHB==='number' ? String(item.costTHB) : '';
    const textChanged = !item || data.cost !== (item.cost||'');
    if(thbRaw !== '' && thbRaw !== oldThb) data.costTHB = Math.max(0, Math.round(+thbRaw)||0);      // number edited
    else if(textChanged){ const pc = parseCostTHB(data.cost); data.costTHB = pc!==null ? pc : (thbRaw!==''? +thbRaw : 0); } // price text edited -> recompute
    else data.costTHB = item && typeof item.costTHB==='number' ? item.costTHB : (parseCostTHB(data.cost)||0);
    closeModal();
    if(item){ const id=item.id; mutate(s=>{ const d=s.days.find(d=>d.id===dayId); const t=d&&d.items.find(i=>i.id===id); if(t) Object.assign(t,data); },'บันทึกแล้ว'); }
    else { const nid=uid(); mutate(s=>{ const d=s.days.find(d=>d.id===dayId); if(d && !d.items.some(i=>i.id===nid)) d.items.push({id:nid,locked:false,...data}); },'เพิ่มกิจกรรมแล้ว'); }
  };
}
function hotelForm(city){
  openModal(`<h3 style="margin:0">＋ เสนอที่พัก (${city==='sapa'?'ซาปา':'ฮานอย'})</h3>
   <label>ชื่อที่พัก *<input id="g_name"></label><label>ทำเล<input id="g_area"></label>
   <label>ทำไมน่าสนใจ<textarea id="g_why"></textarea></label><label>ราคา (ประมาณ)<input id="g_price"></label>
   <label>ลิงก์ (Booking/Agoda/อื่น ๆ)<input id="g_link"></label>
   <div class="row" style="margin-top:14px"><button class="btn" id="g_save">บันทึก</button><button class="btn sec" id="g_cancel">ยกเลิก</button></div>`);
  $('#g_cancel').onclick = closeModal;
  $('#g_save').onclick = () => {
    const v = id => $('#'+id).value.trim(); const name=v('g_name'); if(!name){toast('ใส่ชื่อที่พัก');return;}
    const h = {id:'h-'+uid(),custom:true,name,area:v('g_area'),why:(v('g_why')||'')+(me?` (เสนอโดย ${me})`:''),price:v('g_price'),links:v('g_link')?[['ลิงก์',v('g_link')]]:[],map:M(name)};
    closeModal(); mutate(s=>{ if(!s.hotels[city].some(x=>x.id===h.id)) s.hotels[city].push(h); },'เพิ่มที่พักแล้ว');
  };
}

/* ===================== EVENTS ===================== */
document.addEventListener('click', e => {
  const go = e.target.closest('[data-go]'); if(go){ e.preventDefault(); tab=go.dataset.go; render(); scrollTo(0,0); return; }
  const tb = e.target.closest('#tabs button'); if(tb){ tab = tb.dataset.t; render(); return; }
  const b = e.target.closest('[data-act]'); if(!b) return;
  const a = b.dataset.act, dayId = b.dataset.day;
  const needMe = ['vote','rvote'];
  if(needMe.includes(a) && !me){ toast('เลือก “ฉันคือ” ด้านบนก่อนโหวต'); $('#meSel').focus(); return; }
  if(a==='toggle'){ collapsed.has(dayId)?collapsed.delete(dayId):collapsed.add(dayId); render(); return; }
  if(a==='add') return itemForm(dayId);
  if(a==='photo'){ const d=state.days.find(d=>d.id===dayId); const x=d&&d.items.find(i=>i.id===b.dataset.id); if(x) photoBox(x); return; }
  if(a==='gobudget'){ tab='budget'; if(b.dataset.cat) budgetOpen=b.dataset.cat; render(); scrollTo(0,0); return; }
  if(a==='bcat'){ budgetOpen = budgetOpen===b.dataset.cat ? null : b.dataset.cat; render(); return; }
  if(a==='btoggle'){ const key=b.dataset.key; const row=budgetRows().find(r=>r.key===key); if(!row) return; const nowEx=!row.excluded;
    mutate(setRow(key,(t,k)=>{ if(k==='hotel') t.hotelExcluded=nowEx; else if(k==='buffer') t.buffer=!nowEx; else t.excluded=nowEx; }), nowEx?'ตัดออกจากงบแล้ว ✂️':'รวมกลับเข้างบแล้ว'); return; }
  if(a==='bdel'){ const key=b.dataset.key; if(!confirm('ลบรายการงบนี้?')) return; mutate(s=>{ if(s.budget) s.budget.lines=s.budget.lines.filter(l=>'l:'+l.id!==key); },'ลบแล้ว'); return; }
  if(a==='badd'){ const cat=b.dataset.cat; const t=prompt('ชื่อรายการงบ (เช่น ค่าเช่าเสื้อกันหนาว)'); if(!t) return; const c=+prompt('ราคาต่อคน (บาท)','0')||0; const id='c-'+uid();
    mutate(s=>{ s.budget=s.budget||JSON.parse(JSON.stringify(SEED_BUDGET)); if(!s.budget.lines.some(l=>l.id===id)) s.budget.lines.push({id,title:t.trim(),cat,costTHB:Math.max(0,Math.round(c)),custom:true}); },'เพิ่มรายการงบแล้ว'); return; }
  if(a==='rmode'){ routeMode[dayId]=b.dataset.m; localStorage.setItem('sapaRouteMode',JSON.stringify(routeMode)); render(); return; }
  if(a==='edit'){ const d=state.days.find(d=>d.id===dayId); return itemForm(dayId, d.items.find(i=>i.id===b.dataset.id)); }
  if(a==='del'){ const id=b.dataset.id; const d=state.days.find(d=>d.id===dayId); const t=d.items.find(i=>i.id===id);
    if(!confirm('ลบ “'+t.title+'” ?')) return; mutate(s=>{ const d=s.days.find(d=>d.id===dayId); if(d) d.items=d.items.filter(i=>i.id!==id); },'ลบแล้ว'); return; }
  if(a==='up'||a==='down'){ const d=state.days.find(d=>d.id===dayId); const i=+b.dataset.i; const j=a==='up'?i-1:i+1;
    if(j<0||j>=d.items.length) return; const id=d.items[i].id;
    mutate(s=>{ const d=s.days.find(d=>d.id===dayId); const k=d.items.findIndex(x=>x.id===id); const m=a==='up'?k-1:k+1; if(k<0||m<0||m>=d.items.length) return; [d.items[k],d.items[m]]=[d.items[m],d.items[k]]; }); return; }
  if(a==='sort'){ mutate(s=>{ const d=s.days.find(d=>d.id===dayId); const key=t=>{const m=String(t.time).match(/(\d{1,2})[:.](\d{2})/); return m?(+m[1])*60+(+m[2]):9999;}; d.items.sort((x,y)=>key(x)-key(y)); },'เรียงตามเวลาแล้ว'); return; }
  if(a==='vote'){ const id=b.dataset.id, who=me; const on=!((state.votes||{})[id]||[]).includes(who);
    mutate(s=>{ s.votes=s.votes||{}; const v=new Set(s.votes[id]||[]); on?v.add(who):v.delete(who); s.votes[id]=[...v]; }, on?'โหวตแล้ว ❤️':'ยกเลิกโหวตแล้ว'); return; }
  if(a==='rvote'){ const k=b.dataset.k, who=me; const on=!(state.retVotes[k]||[]).includes(who);
    mutate(s=>{ s.retVotes=s.retVotes||{A:[],B:[]}; const v=new Set(s.retVotes[k]||[]); on?v.add(who):v.delete(who); s.retVotes[k]=[...v]; }); return; }
  if(a==='hadd') return hotelForm(b.dataset.city);
  if(a==='hdel'){ const id=b.dataset.id; if(!confirm('ลบที่พักนี้?')) return; mutate(s=>{ for(const c of ['sapa','hanoi']) s.hotels[c]=s.hotels[c].filter(x=>x.id!==id); delete s.votes[id]; },'ลบแล้ว'); return; }
  if(a==='copy'){ copy(shareLink()); return; }
  if(a==='export'){ const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}); const u=URL.createObjectURL(blob); const l=document.createElement('a'); l.href=u; l.download='sapa-trip-'+new Date().toISOString().slice(0,10)+'.json'; l.click(); setTimeout(()=>URL.revokeObjectURL(u),2000); return; }
  if(a==='reset'){ if(!confirm('รีเซ็ตเป็นแผนแนะนำ? การแก้ไขและโหวตของทุกคนจะหายหมด')) return; const fresh=seed(); mutate(s=>{ const f=JSON.parse(JSON.stringify(fresh)); f.rev=s.rev; return f; },'รีเซ็ตแล้ว'); return; }
});
document.addEventListener('change', e => {
  if(e.target.dataset.bcost){ const key=e.target.dataset.bcost, val=Math.max(0,Math.round(+e.target.value||0));
    mutate(setRow(key,(t)=>{ t.costTHB=val; }),'อัปเดตราคาแล้ว'); return; }
  if(e.target.dataset.bset){ const k=e.target.dataset.bset, val=e.target.value; mutate(s=>{ s.budget=s.budget||JSON.parse(JSON.stringify(SEED_BUDGET)); s.budget[k]=val; },'อัปเดตงบแล้ว'); return; }
  if(e.target.id==='meSel'){ me=e.target.value; localStorage.setItem('sapaMe',me); render(); if(me) toast('สวัสดี '+me+' 👋'); return; }
  if(e.target.dataset.notes){ const id=e.target.dataset.notes, val=e.target.value; const d=state.days.find(d=>d.id===id); if(d && d.notes===val) return;
    mutate(s=>{ const d=s.days.find(d=>d.id===id); if(d) d.notes=val; },'บันทึกโน้ตแล้ว'); return; }
  if(e.target.id==='importF'){ const f=e.target.files[0]; if(!f) return; const r=new FileReader();
    r.onload=()=>{ try{ const j=JSON.parse(r.result); if(!Array.isArray(j.days)) throw 0; if(!confirm('นำเข้าไฟล์นี้แทนแผนปัจจุบัน?')) return; mutate(s=>{ const c=JSON.parse(JSON.stringify(j)); c.rev=s.rev; return c; },'นำเข้าแล้ว'); }catch(err){ toast('ไฟล์ไม่ถูกต้อง'); } }; r.readAsText(f); }
});
$('#refreshBtn').onclick = () => { if(pending.length) flush(); else poll(true); };
$('#shareBtn').onclick = async () => { const url=shareLink();
  if(navigator.share){ try{ await navigator.share({title:'ทริปซาปา 28–31 ธ.ค.',text:'แผนเที่ยวฮานอย+ซาปา แก้ไขได้ทุกคน',url}); return; }catch(e){} }
  copy(url); };
function copy(t){ (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>toast('คัดลอกลิงก์แล้ว ส่งให้เพื่อนได้เลย')).catch(()=>prompt('คัดลอกลิงก์นี้',t)); }
window.addEventListener('beforeunload', e => { if(pending.length){ e.preventDefault(); e.returnValue=''; } });

load();
</script>
